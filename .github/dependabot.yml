version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    exclude-paths:
      # Vendored Cordis sources follow vendor/README.md instead of registry updates.
      - "vendor/**"
    schedule:
      interval: "cron"
      cronjob: "0 4 * * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 30
    ignore:
      # Deliberate pins, documented in pnpm-workspace.yaml: Koffi 3.3.2's
      # source build fails under GCC 13, and lexical@0.49.0 carries a
      # reviewed patch. Bumps reopen when those sequences land.
      - dependency-name: "koffi"
      - dependency-name: "lexical"
      - dependency-name: "app-builder-lib"
      - dependency-name: "exceljs"
      - dependency-name: "mdast-util-gfm-autolink-literal"
      - dependency-name: "micromark-extension-gfm-autolink-literal"
      - dependency-name: "node-pty"
      - dependency-name: "@yao-pkg/pkg-fetch"
      - dependency-name: "@lexical/*"
    labels:
      - "kind/dependency"
      - "area/infra"

  - package-ecosystem: "uv"
    directory: "/python/sdk"
    schedule:
      interval: "cron"
      cronjob: "0 4 * * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 30
    labels:
      - "kind/dependency"
      - "area/infra"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 4 * * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 30
    labels:
      - "kind/dependency"
      - "area/infra"
